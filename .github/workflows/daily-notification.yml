
name: Daily Stock Souvenir Notification

on:
  schedule:
    # 09:00 AM UTC+8 = 01:00 UTC
    - cron: '0 1 * * *'
    # 13:30 PM UTC+8 = 05:30 UTC (Just before 13:30 deadline)
    - cron: '30 5 * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger line-notify Edge Function
        run: |
          curl -i --location --request POST '${{ secrets.SUPABASE_URL }}/functions/v1/line-notify' \
            --header 'Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}' \
            --header 'Content-Type: application/json'
